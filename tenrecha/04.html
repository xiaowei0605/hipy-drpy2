<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
background: transparent;
margin: 0;
padding: 10px;
overflow: auto;
height: auto;
font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
}
.container {
max-width: 580px;
margin: 0 auto;
background: #f7f1e5;
border: 2px solid #c8b99c;
box-shadow: 0 8px 24px rgba(60, 47, 47, 0.15);
border-radius: 4px;
padding: 24px 20px;

}
.container::-webkit-scrollbar {

}
.title-custom {

text-align: center;

}
.poem-paper {

}
.poem-line {

bottom: 12px;

align-items: center;

}

</style>
</head>
<body>
<div class="container">
<p class="title-custom">乾明宫·御案夹层断简</p>
<div class="desk-mat">
<div id="paperNormal" class="poem-paper">
<div class="poem-line">阶前新白压枝低，</div>
<div class="poem-line">偶向幽禽借一枝。</div>
<div class="poem-line">莫道韶华容易老，</div>
<div class="poem-line">深宫犹有未题诗。</div>
<div class="imperial-note">
朱批杂记：五月十一，慈宁宫折花。彼言“浮生若寄”，声甚细，如冷玉堕水。字迹草草，心绪杂乱，不可令外臣观。
</div>
<div class="seal-mark">御览<br>之宝</div>
</div>

<div id="paperBurned" class="burned-state hidden-box">

（元宝悄声入内，换下一盏残茶，低头装作未见。）
</div>

<div class="action-bar">
<button id="btnRead" class="btn-action">翻捡残简</button>
<button id="btnBurn" class="btn-action btn-burn">投炉销毁</button>
</div>
</div>
</div>

<script>
(function(){
var state = 0;
var poems = [
{
lines: ["阶前新白压枝低，", "偶向幽禽借一枝。", "莫道韶华容易老，", "深宫犹有未题诗。"],
note: "朱批杂记：五月十一，慈宁宫折花。彼言“浮生若寄”，声甚细，如冷玉堕水。字迹草草，心绪杂乱，不可令外臣观。"
},
{
lines: ["庭前叶落又一秋，", "少年心事白了头。", "欲将笔墨问归处，", "恐被人知笑不休。"],
note: "旧简：永平七年秋夜批折毕书。酸腐文士之态，殊无帝王气象，当毁。"
},
{
lines: ["梦里不知身是客，", "醒来犹在帝王家。", "若问平生何所愿，", "寻常巷陌一瓯茶。"],
note: "旧简：永平九年春夜。此语大逆，若落御史台中丞之耳，恐生大波。"
}
];

var pNormal = document.getElementById('paperNormal');
var pBurned = document.getElementById('paperBurned');
var btnRead = document.getElementById('btnRead');
var btnBurn = document.getElementById('btnBurn');

function renderPoem(idx) {
pNormal.classList.remove('hidden-box');
pBurned.classList.add('hidden-box');
var item = poems[idx];
var html = '';
for(var i=0; i<item.lines.length; i++) {
html += '<div class="poem-line">' + item.lines[i] + '</div>';
}
html += '<div class="imperial-note">' + item.note + '</div>';
html += '<div class="seal-mark">御览<br>之宝</div>';
pNormal.innerHTML = html;
}

btnRead.onclick = function() {
state = (state + 1) % poems.length;
renderPoem(state);
};

btnBurn.onclick = function() {
pNormal.classList.add('hidden-box');
pBurned.classList.remove('hidden-box');
};
})();
</script>
</body>
</html>
